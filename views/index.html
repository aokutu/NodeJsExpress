<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <script>
  $(document).ready(function () {
    $.get('/api/me', function (data) {
      if (data && data.username) {
        $('#username').text(data.username);
      }
    }).fail(function () {
      $('#username').text('Guest');
    });
  });
</script>

</head>
<body class="bg-slate-950 text-slate-100">

  <div class="min-h-screen flex">

    <!-- Left Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 space-y-2 shrink-0">
      <div class="pb-3 mb-3 border-b border-slate-800">
        <span class="font-bold text-lg text-emerald-400">Express Notes</span>
      </div>

      <a href="/" class="block px-3 py-2 rounded bg-slate-800 text-sm text-white">
        Overview
      </a>

      <!-- Sub-menu 1 -->
      <div>
        <button id="btn-setup" type="button" class="w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800">
          1. Getting Started
        </button>
        <div id="sub-setup" class="hidden pl-4 mt-1 space-y-1">
          <a href="/setup" class="block px-3 py-1.5 rounded text-sm text-slate-400 hover:text-emerald-400">Project Setup</a>
          <a href="/server" class="block px-3 py-1.5 rounded text-sm text-slate-400 hover:text-emerald-400">Express Server</a>
        </div>
      </div>

      <!-- Sub-menu 2 -->
      <div>
        <button id="btn-routes" type="button" class="w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800">
          2. REST Routes
        </button>
        <div id="sub-routes" class="hidden pl-4 mt-1 space-y-1">
          <a href="/routes/get" class="block px-3 py-1.5 rounded text-sm text-slate-400 hover:text-emerald-400">GET Requests</a>
          <a href="/routes/post" class="block px-3 py-1.5 rounded text-sm text-slate-400 hover:text-emerald-400">POST Requests</a>
          <a href="/routes/params" class="block px-3 py-1.5 rounded text-sm text-slate-400 hover:text-emerald-400">Route Params (:id)</a>
        </div>
      </div>
    </aside>

    <!-- Right Side -->
    <div class="flex-1 flex flex-col">

      <!-- Top Bar -->
      <header class="h-14 px-6 bg-slate-900 border-b border-slate-800 flex items-center justify-end gap-3">
        <span class="text-sm text-slate-400">
          User: <strong id="username" class="text-white">Guest</strong>
        </span>
        <form action="/logout" method="POST" class="inline">
          <button type="submit" class="px-3 py-1 rounded text-sm bg-slate-800 hover:bg-slate-700 text-slate-200">
            Logout
          </button>
        </form>
      </header>

      <!-- Main Content -->
      <main id="content" class="p-8 max-w-3xl">
        <h1 class="text-2xl font-bold mb-3">Express Learning Page</h1>
        <p class="text-slate-400 mb-6">
          Use this page as a simple shell while you build out your Express routes, middlewares, and controllers.
        </p>
        <div class="border border-dashed border-slate-700 rounded-lg p-8 text-slate-400">
          Put your page content or Express-rendered data here.
        </div>
      </main>

    </div>
  </div>

  <script>
    $(document).ready(function () {
      // Toggle sidebar sub-menus with jQuery
      $("#btn-setup").on("click", function () {
        $("#sub-setup").toggleClass("hidden");
      });

      $("#btn-routes").on("click", function () {
        $("#sub-routes").toggleClass("hidden");
      });

      // Optional: load current user from an Express endpoint like GET /api/me
      $.get("/api/me")
        .done(function (data) {
          if (data && data.username) {
            $("#username").text(data.username);
          }
        })
        .fail(function () {
          $("#username").text("Guest");
        });
    });
  </script>

</body>
</html>
