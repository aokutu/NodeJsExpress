<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>Sign In — Express Docs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-center items-center px-4">

  <!-- Back to Landing Page Link -->
  <div class="w-full max-w-md mb-6 flex items-center justify-between">
    <a href="/" class="text-sm text-slate-400 hover:text-emerald-400 transition flex items-center gap-1.5">
      <span>&larr;</span> Back to Docs
    </a>
    <span class="font-bold text-sm tracking-tight text-emerald-400">Express Docs</span>
  </div>

  <!-- Auth Card -->
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
    
    <!-- Toggle Tabs -->
    <div class="grid grid-cols-2 border-b border-slate-800 bg-slate-950/40 p-1.5 gap-1.5">
      <button
        id="tab-login"
        type="button"
        onclick="switchTab('login')"
        class="py-2.5 text-sm font-medium rounded-xl bg-slate-800 text-white shadow transition"
      >
        Sign In
      </button>
      <button
        id="tab-register"
        type="button"
        onclick="switchTab('register')"
        class="py-2.5 text-sm font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"
      >
        Register
      </button>
    </div>

    <div class="p-8">
      <!-- Status Alert Box (Hidden by default, useful for API feedback later) -->
      <div id="alert-box" class="hidden mb-5 px-4 py-3 rounded-lg text-xs font-mono border"></div>

      <!-- LOGIN FORM -->
      <form id="form-login" onsubmit="handleAuth(event, '/api/login')" class="space-y-5">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
          <p class="text-sm text-slate-400 mt-1">Sign in to access your saved tutorial progress.</p>
        </div>

        <div>
          <label for="login-email" class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
          <input
            id="login-email"
            name="email"
            type="email"
            required
            placeholder="dev@example.com"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-xs font-medium text-slate-300">Password</label>
            <a href="#" class="text-xs text-emerald-400 hover:underline">Forgot password?</a>
          </div>
          <input
            id="login-password"
            name="password"
            type="password"
            required
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 px-4 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-sm transition shadow-lg shadow-emerald-500/10"
        >
          Sign In
        </button>

        <p class="text-center text-xs text-slate-400 pt-2">
          Don't have an account?
          <button type="button" onclick="switchTab('register')" class="text-emerald-400 font-medium hover:underline">
            Create one
          </button>
        </p>
      </form>

      <!-- REGISTRATION FORM (Hidden by default) -->
      <form id="form-register" onsubmit="handleAuth(event, '/api/register')" class="hidden space-y-5">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Create an account</h1>
          <p class="text-sm text-slate-400 mt-1">Start tracking your Node.js & Express API lessons.</p>
        </div>

        <div>
          <label for="reg-name" class="block text-xs font-medium text-slate-300 mb-1.5">Username</label>
          <input
            id="reg-name"
            name="username"
            type="text"
            required
            placeholder="code_master"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
          />
        </div>

        <div>
          <label for="reg-email" class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
          <input
            id="reg-email"
            name="email"
            type="email"
            required
            placeholder="dev@example.com"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
          />
        </div>

        <div>
          <label for="reg-password" class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
          <input
            id="reg-password"
            name="password"
            type="password"
            required
            placeholder="Create a password"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 px-4 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-sm transition shadow-lg shadow-emerald-500/10"
        >
          Create Account
        </button>

        <p class="text-center text-xs text-slate-400 pt-2">
          Already have an account?
          <button type="button" onclick="switchTab('login')" class="text-emerald-400 font-medium hover:underline">
            Sign in
          </button>
        </p>
      </form>
    </div>
  </div>

  <!-- Toggle & API Placeholder Script -->
  <script>
    function switchTab(mode) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const alertBox = document.getElementById('alert-box');

      // Reset alert box when switching tabs
      alertBox.classList.add('hidden');

      if (mode === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');

        tabLogin.classList.add('bg-slate-800', 'text-white', 'shadow');
        tabLogin.classList.remove('text-slate-400');

        tabRegister.classList.remove('bg-slate-800', 'text-white', 'shadow');
        tabRegister.classList.add('text-slate-400');
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');

        tabRegister.classList.add('bg-slate-800', 'text-white', 'shadow');
        tabRegister.classList.remove('text-slate-400');

        tabLogin.classList.remove('bg-slate-800', 'text-white', 'shadow');
        tabLogin.classList.add('text-slate-400');
      }
    }

    // Ready for your Express POST routes (/api/login & /api/register)
    async function handleAuth(event, endpoint) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const payload = Object.fromEntries(formData.entries());

      const alertBox = document.getElementById('alert-box');
      alertBox.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
      alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      alertBox.textContent = `Ready to POST to ${endpoint}: ${JSON.stringify(payload)}`;

      /* Uncomment when you build your Express POST routes:
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) window.location.href = '/';
      } catch (err) {
        console.error(err);
      }
      */
    }
  </script>

</body>
</html>
